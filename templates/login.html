{% extends "base.html" %}{% block title %}{{ t.login }} — {{ t.brand }}{% endblock %}
{% block content %}
<main class="auth-screen">
  <section class="auth-panel">
    <div class="omni-core"><span>DNA</span></div>
    <div class="status">{{ t.online }}</div>
    <h1>{{ t.welcome }}</h1>
    {% if error %}<div class="alert">{{ t[error] }}</div>{% endif %}
    <form method="post" class="auth-redirect-form" data-success-url="{{ url_for('aliens') }}">
      <label>{{ t.username }}</label><input name="username" required autocomplete="username">
      <label>{{ t.password }}</label><input type="password" name="password" required autocomplete="current-password">
      <button class="omni-button" type="submit">{{ t.login }}</button>
    </form>
    <a class="sub-link" href="{{ url_for('register') }}">{{ t.create_account }}</a>
  </section>
</main>
{% endblock %}
