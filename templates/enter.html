{% extends "base.html" %}{% block title %}{{ t.brand }}{% endblock %}
{% block content %}
<main class="auth-screen">
  <section class="auth-panel">
    <div class="omni-core"><span>DNA</span></div>
    <div class="status">{{ t.online }}</div>
    <h1>{{ t.welcome }}</h1>
    {# O main.js dispara a animação do Omnitrix sozinho e leva para o href. Este link só aparece se o JavaScript estiver desligado. #}
    <a class="omni-button" href="{{ url_for('aliens') }}" data-omnitrix-entry data-label="OMNITRIX" data-name="{{ t.online }}">{{ t.access }}</a>
  </section>
</main>
{% endblock %}
